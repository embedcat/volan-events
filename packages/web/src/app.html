<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<!-- Установка на экран «Домой» (D151) -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Волан" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#1f63d6" />
		<script>
			// Тема, выбранная вручную, — до отрисовки, чтобы страница не мигала
			try {
				var mode = localStorage.getItem('volan.theme');
				if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
